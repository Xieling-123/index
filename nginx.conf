server {
    listen 80;
    server_name localhost;

    # 主网页目录
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # 【监控接口 1】供 K8s 探针每秒检查网站是否存活
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # 【监控接口 2】暴露 Nginx 实时活跃连接数、请求总数（供 Prometheus 等监控大屏抓取）
    location /nginx_status {
        stub_status on;
        access_log off;
    }
}
